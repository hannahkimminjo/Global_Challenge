import cv2
import mediapipe as mp
import numpy as np
import random

# Mediapipe 설정
mp_hands = mp.solutions.hands
mp_drawing = mp.solutions.drawing_utils

# Q-learning 파라미터
actions = ['idle', 'reach']
q_table = np.zeros((2, 2))  # [state, action]
alpha = 0.1
gamma = 0.9
epsilon = 0.2

def get_state(landmarks):
    """손이 화면 중앙을 향해 있는지 여부"""
    if landmarks:
        x = landmarks[0].x
        return 1 if 0.4 < x < 0.6 else 0
    return 0

def get_reward(state, action):
    """간단한 보상 함수"""
    if state == 1 and action == 1:
        return 1  # 목표 동작 수행
    elif state == 0 and action == 1:
        return -1  # 엉뚱한 곳에 손 뻗기
    return 0  # 아무 동작 없음

cap = cv2.VideoCapture(0)

with mp_hands.Hands(min_detection_confidence=0.7, min_tracking_confidence=0.5) as hands:
    while cap.isOpened():
        ret, frame = cap.read()
        if not ret:
            break

        # 이미지 전처리
        image = cv2.cvtColor(frame, cv2.COLOR_BGR2RGB)
        results = hands.process(image)

        state = 0
        if results.multi_hand_landmarks:
            landmarks = results.multi_hand_landmarks[0].landmark
            state = get_state(landmarks)

            # 손가락 시각화
            mp_drawing.draw_landmarks(frame, results.multi_hand_landmarks[0], mp_hands.HAND_CONNECTIONS)

        # Epsilon-greedy action 선택
        if random.uniform(0, 1) < epsilon:
            action = random.choice([0, 1])
        else:
            action = np.argmax(q_table[state])

        reward = get_reward(state, action)
        next_state = state

        # Q-learning 업데이트
        q_table[state, action] += alpha * (reward + gamma * np.max(q_table[next_state]) - q_table[state, action])

        # 피드백 표시
        feedback = f"State: {state}, Action: {action}, Reward: {reward}"
        cv2.putText(frame, feedback, (10, 30), cv2.FONT_HERSHEY_SIMPLEX, 1, (0,255,0), 2)

        cv2.imshow('AR Cognitive Trainer (Simulated)', frame)
        if cv2.waitKey(1) & 0xFF == ord('q'):
            break

cap.release()
cv2.destroyAllWindows()
